<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        :root {
            --bg: #020617;
            --panel: rgba(15, 23, 42, 0.92);
            --panel-soft: #1e293b;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --danger: #fb7185;
            --border: rgba(148, 163, 184, 0.24);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at top, rgba(14, 165, 233, 0.18), transparent 30%),
                linear-gradient(160deg, #020617 0%, #0f172a 50%, #111827 100%);
            color: var(--text);
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        .card {
            width: min(100%, 420px);
            padding: 28px;
            border-radius: 20px;
            background: var(--panel);
            border: 1px solid var(--border);
            box-shadow: 0 30px 80px rgba(2, 6, 23, 0.48);
            backdrop-filter: blur(14px);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.8rem;
        }

        p {
            margin: 0 0 20px;
            color: var(--muted);
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--panel-soft);
            color: var(--text);
            font-size: 1rem;
        }

        input:focus {
            outline: 2px solid rgba(56, 189, 248, 0.35);
            border-color: rgba(56, 189, 248, 0.55);
        }

        button {
            width: 100%;
            padding: 12px 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            color: #082f49;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(1.05);
        }

        .hint,
        .error,
        .status {
            margin-top: 14px;
            font-size: 0.92rem;
        }

        .hint,
        .status {
            color: var(--muted);
        }

        .error {
            color: var(--danger);
        }

        .hidden {
            display: none;
        }

        .link-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 18px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .link-row a {
            color: var(--accent);
            text-decoration: none;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 16px 0;
            color: var(--muted);
            font-size: 0.85rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .btn-microsoft {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--panel-soft);
            color: var(--text);
            font-weight: 600;
            font-size: 0.97rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            transition: background 0.15s;
        }

        .btn-microsoft:hover {
            background: #243347;
        }

        .btn-microsoft svg {
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Admin Login</h1>
        <p>Use the local admin password to unlock the panel server. If configured, the server will also ask for a security answer.</p>

        <div id="azureSection" class="hidden">
            <a id="azureBtn" href="#" class="btn-microsoft">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 21 21">
                    <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
                    <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
                    <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
                    <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
                </svg>
                Sign in with Microsoft
            </a>
            <div id="azureDivider" class="divider hidden"><span>or use password</span></div>
        </div>

        <form id="loginForm">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <div id="securityQuestionWrap" class="hidden">
                <label id="securityQuestionLabel" for="securityAnswer">Security answer</label>
                <input id="securityAnswer" name="securityAnswer" type="text" autocomplete="off">
            </div>

            <button type="submit">Sign In</button>
        </form>

        <div id="status" class="status hidden"></div>
        <div id="error" class="error hidden"></div>
        <div id="hint" class="hint hidden"></div>

        <div class="link-row">
            <span>Protected local admin access</span>
            <a href="/">Back to site</a>
        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const nextTarget = params.get('next') || '/panel';
        const form = document.getElementById('loginForm');
        const statusEl = document.getElementById('status');
        const errorEl = document.getElementById('error');
        const hintEl = document.getElementById('hint');
        const questionWrap = document.getElementById('securityQuestionWrap');
        const questionLabel = document.getElementById('securityQuestionLabel');
        const answerInput = document.getElementById('securityAnswer');
        const azureSection = document.getElementById('azureSection');
        const azureBtn = document.getElementById('azureBtn');
        const azureDivider = document.getElementById('azureDivider');

        function setMessage(element, text) {
            element.textContent = text || '';
            element.classList.toggle('hidden', !text);
        }

        async function loadStatus() {
            try {
                const response = await fetch('/api/admin/auth/status', { credentials: 'same-origin' });
                const payload = await response.json();

                if (payload.azureAdConfigured) {
                    azureBtn.href = `/api/admin/auth/azure?next=${encodeURIComponent(nextTarget)}`;
                    azureSection.classList.remove('hidden');
                    if (payload.configured) {
                        azureDivider.classList.remove('hidden');
                    } else {
                        form.classList.add('hidden');
                    }
                }

                if (!payload.configured && !payload.azureAdConfigured) {
                    setMessage(hintEl, 'ADMIN_PASSWORD is not configured on the server yet. Add it to .env before using this page.');
                    form.classList.add('hidden');
                    return;
                }

                if (payload.securityQuestion) {
                    questionWrap.classList.remove('hidden');
                    questionLabel.textContent = payload.securityQuestion;
                    answerInput.required = true;
                }

                if (payload.authenticated) {
                    window.location.replace(nextTarget);
                }
            } catch (error) {
                setMessage(errorEl, 'Unable to reach the admin auth endpoint. Start the panel server and try again.');
            }
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            setMessage(errorEl, '');
            setMessage(statusEl, 'Checking credentials...');

            const response = await fetch('/api/admin/auth/login', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    password: document.getElementById('password').value,
                    securityAnswer: answerInput.value
                })
            });

            const payload = await response.json().catch(() => ({}));
            if (!response.ok) {
                setMessage(statusEl, '');
                setMessage(errorEl, payload.error || 'Login failed');
                return;
            }

            setMessage(statusEl, 'Access granted. Redirecting...');
            window.location.replace(nextTarget);
        });

        loadStatus();
    </script>
</body>
</html>
