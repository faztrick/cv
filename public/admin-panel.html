<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Job Automation Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #1a1a2e;
            --bg-card: #16213e;
            --accent: #0f3460;
            --highlight: #e94560;
            --text: #e0e0e0;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .card {
            background-color: var(--bg-card);
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
        }
        .card-header {
            background-color: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-weight: bold;
            color: #00d4ff;
        }
        .btn-primary {
            background-color: #00d4ff;
            border: none;
            color: #1a1a2e;
            font-weight: bold;
        }
        .btn-primary:hover {
            background-color: #00b8e6;
            color: #1a1a2e;
        }
        .btn-danger {
            background-color: var(--highlight);
            border: none;
        }
        .log-window {
            background-color: #000;
            border-radius: 10px;
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            font-family: 'Consolas', monospace;
            font-size: 0.9rem;
            border: 1px solid #333;
        }
        .log-entry {
            margin-bottom: 5px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 2px;
        }
        .log-time { color: #666; margin-right: 10px; }
        .log-info { color: #00d4ff; }
        .log-error { color: #ff4757; }
        .log-success { color: #2ed573; }
        .log-system { color: #ffa502; font-weight: bold; }

        .status-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #666;
        }
        .status-active { background-color: #2ed573; box-shadow: 0 0 10px #2ed573; }

        .iframe-container {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 10px;
            background: #fff;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-robot me-2"></i>Job Automation Admin Panel
            </span>
            <div class="d-flex align-items-center">
                <span class="badge bg-success me-3">GPT-5.1 Active</span>
                <button class="btn btn-sm btn-outline-danger" onclick="clearLocks()">
                    <i class="fas fa-skull me-1"></i> Kill All & Clear Locks
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="row">
            <!-- Left Column: Tools -->
            <div class="col-md-4">
                <!-- Job Search Card -->
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-search me-2"></i>Job Search
                        <div id="status-job-search" class="status-badge"></div>
                    </div>
                    <div class="card-body">
                        <form id="searchForm" onsubmit="startSearch(event)">
                            <div class="mb-3">
                                <label class="form-label">Platform</label>
                                <select class="form-select bg-dark text-light" id="platform">
                                    <option value="indeed">Indeed</option>
                                    <option value="linkedin">LinkedIn</option>
                                    <option value="bayt">Bayt</option>
                                    <option value="gulftalent">GulfTalent</option>
                                    <option value="naukrigulf">NaukriGulf</option>
                                    <option value="dubizzle">Dubizzle</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Keyword</label>
                                <input type="text" class="form-control bg-dark text-light" id="keyword" value="Software Developer">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Location</label>
                                <input type="text" class="form-control bg-dark text-light" id="location" value="Dubai">
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-play me-2"></i>Start Search
                                </button>
                                <button type="button" class="btn btn-outline-danger btn-sm" onclick="stopProcess('job-search')">
                                    Stop
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Session Manager -->
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-key me-2"></i>Session Manager
                        <div id="status-session" class="status-badge"></div>
                    </div>
                    <div class="card-body">
                        <p class="small text-muted">Open browser to manually log in to accounts.</p>
                        <div class="d-grid">
                            <button class="btn btn-outline-info mb-2" onclick="startSessionSetup()">
                                <i class="fas fa-external-link-alt me-2"></i>Open Browser for Login
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Follow-up Tool -->
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-comments me-2"></i>Follow-up Automation
                        <div id="status-followup" class="status-badge"></div>
                    </div>
                    <div class="card-body">
                        <p class="small text-muted">AI-powered bulk follow-up tool.</p>
                        <div class="d-grid gap-2">
                            <button class="btn btn-success" onclick="launchFollowupTool()">
                                <i class="fas fa-rocket me-2"></i>Launch Tool
                            </button>
                            <a href="http://localhost:3456" target="_blank" id="followupLink" class="btn btn-outline-light btn-sm d-none">
                                <i class="fas fa-window-maximize me-2"></i>Open Panel
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Email Outreach -->
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-envelope me-2"></i>Email Outreach
                    </div>
                    <div class="card-body">
                        <div class="d-grid gap-2">
                            <button class="btn btn-outline-warning" onclick="openEmails()">
                                <i class="fas fa-paper-plane me-2"></i>Open Gmail Drafts
                            </button>
                            <button class="btn btn-outline-info" onclick="apiCall('/api/smart-email')">
                                <i class="fas fa-magic me-2"></i>Generate Smart Emails
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Tools & Maintenance -->
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-tools me-2"></i>Tools & Maintenance
                    </div>
                    <div class="card-body">
                        <div class="row g-2">
                            <div class="col-6">
                                <button class="btn btn-outline-light w-100" onclick="apiCall('/api/cv-parser')">
                                    <i class="fas fa-file-alt me-2"></i>Parse CV
                                </button>
                            </div>
                            <div class="col-6">
                                <button class="btn btn-outline-light w-100" onclick="apiCall('/api/outreach')">
                                    <i class="fas fa-bullhorn me-2"></i>Outreach
                                </button>
                            </div>
                            <div class="col-6">
                                <button class="btn btn-outline-light w-100" onclick="apiCall('/api/auto-fill')">
                                    <i class="fas fa-pen-fancy me-2"></i>Auto-Fill
                                </button>
                            </div>
                            <div class="col-6">
                                <button class="btn btn-outline-danger w-100" onclick="apiCall('/api/clean-cache')">
                                    <i class="fas fa-trash me-2"></i>Clean Cache
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Logs & Output -->
            <div class="col-md-8">
                <div class="card h-100">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="fas fa-terminal me-2"></i>System Logs</span>
                        <button class="btn btn-sm btn-outline-secondary" onclick="clearLogs()">Clear</button>
                    </div>
                    <div class="card-body p-0">
                        <div id="logWindow" class="log-window">
                            <div class="log-entry"><span class="log-time">System</span><span class="log-system">Admin Panel Ready...</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Connect to SSE for logs
        const eventSource = new EventSource('/api/logs');
        const logWindow = document.getElementById('logWindow');

        eventSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            addLog(data.message, data.type);
        };

        function addLog(message, type = 'info') {
            const div = document.createElement('div');
            div.className = 'log-entry';
            const time = new Date().toLocaleTimeString();

            // Clean ANSI codes
            const cleanMessage = message.replace(/[\u001b\u009b][[()#;?]*(?:[0-9]{1,4}(?:;[0-9]{0,4})*)?[0-9A-ORZcf-nqry=><]/g, '');

            div.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-${type}">${cleanMessage}</span>`;
            logWindow.appendChild(div);
            logWindow.scrollTop = logWindow.scrollHeight;
        }

        function clearLogs() {
            logWindow.innerHTML = '';
        }

        async function apiCall(endpoint, method = 'POST', body = {}) {
            try {
                const res = await fetch(endpoint, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: method === 'POST' ? JSON.stringify(body) : undefined
                });
                return await res.json();
            } catch (e) {
                addLog(`API Error: ${e.message}`, 'error');
                return { success: false };
            }
        }

        async function startSearch(e) {
            e.preventDefault();
            const platform = document.getElementById('platform').value;
            const keyword = document.getElementById('keyword').value;
            const location = document.getElementById('location').value;

            document.getElementById('status-job-search').classList.add('status-active');

            const res = await apiCall('/api/job-search', 'POST', { platform, keyword, location });
            if (!res.success) {
                addLog(res.error, 'error');
                document.getElementById('status-job-search').classList.remove('status-active');
            }
        }

        async function startSessionSetup() {
            document.getElementById('status-session').classList.add('status-active');
            await apiCall('/api/session-setup');
        }

        async function launchFollowupTool() {
            document.getElementById('status-followup').classList.add('status-active');
            const res = await apiCall('/api/followup-tool');
            if (res.success) {
                const link = document.getElementById('followupLink');
                link.href = `http://localhost:${res.port}`;
                link.classList.remove('d-none');
                // Open in new tab automatically
                window.open(`http://localhost:${res.port}`, '_blank');
            }
        }

        async function openEmails() {
            await apiCall('/api/open-emails');
        }

        async function clearLocks() {
            if(confirm('Are you sure? This will close all Chrome windows.')) {
                await apiCall('/api/clear-locks');
                // Reset status indicators
                document.querySelectorAll('.status-badge').forEach(el => el.classList.remove('status-active'));
            }
        }

        async function stopProcess(id) {
            await apiCall(`/api/stop/${id}`);
            document.getElementById(`status-${id}`).classList.remove('status-active');
        }

        // Poll status
        setInterval(async () => {
            const res = await apiCall('/api/status', 'GET');
            if (res.processes) {
                // Update active indicators
                document.querySelectorAll('.status-badge').forEach(el => el.classList.remove('status-active'));
                res.processes.forEach(proc => {
                    const el = document.getElementById(`status-${proc}`);
                    if (el) el.classList.add('status-active');
                });
            }
        }, 2000);
    </script>
</body>
</html>
