version: "3.9"
services:
  db:
    image: postgres:15
    container_name: fanhouse_test_db
    environment:
      POSTGRES_DB: fanhouse_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - fanhouse_test_pg:/var/lib/postgresql/data

volumes:
  fanhouse_test_pg:
