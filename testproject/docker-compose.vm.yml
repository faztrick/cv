version: "3.9"

services:
  db:
    image: postgres:15
    container_name: cv_vm_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cv}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - cv_vm_pg:/var/lib/postgresql/data
    networks:
      - cv_vm

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: cv_vm_api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      NODE_ENV: production
      PORT: ${API_PORT:-4000}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN}
      SUBSCRIPTION_PRICE_CENTS: ${SUBSCRIPTION_PRICE_CENTS:-0}
      # Leave empty on VM to use local filesystem uploads (mounted volume below)
      UPLOADS_BUCKET: ${UPLOADS_BUCKET:-}
      # Optional seed overrides
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_FAN_EMAIL: ${SEED_FAN_EMAIL:-}
      SEED_FAN_PASSWORD: ${SEED_FAN_PASSWORD:-}
      SEED_CREATOR_EMAIL: ${SEED_CREATOR_EMAIL:-}
      SEED_CREATOR_PASSWORD: ${SEED_CREATOR_PASSWORD:-}
    volumes:
      - ./vm_data/uploads:/app/uploads
    expose:
      - "4000"
    networks:
      - cv_vm

  db-init:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: cv_vm_db_init
    depends_on:
      - db
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
    command: ["sh", "-lc", "sleep 5 && npm run db:deploy && npm run db:seed"]
    restart: "no"
    profiles: ["init"]
    networks:
      - cv_vm

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: cv_vm_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 8080
    expose:
      - "8080"
    networks:
      - cv_vm

  nginx:
    image: nginx:1.27-alpine
    container_name: cv_vm_nginx
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
    volumes:
      - ./deploy/vm/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Optional: serve Flutter Web if you copy build output into ./vm_data/flutter-web
      - ./vm_data/flutter-web:/usr/share/nginx/html/flutter:ro
    networks:
      - cv_vm

volumes:
  cv_vm_pg:

networks:
  cv_vm:
    driver: bridge
