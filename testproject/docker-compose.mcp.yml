version: '3.9'

# MCP Servers Docker Compose
# Use: docker compose -f docker-compose.mcp.yml up -d
# This keeps MCP server containers running to avoid cold-start delays

x-mcp-healthcheck: &mcp-healthcheck
  test: ["CMD", "echo", "healthy"]
  interval: 30s
  timeout: 10s
  retries: 3

x-mcp-logging: &mcp-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-mcp-env: &mcp-env
  MCP_TIMEOUT: "120000"
  MCP_STARTUP_TIMEOUT: "60000"

x-mcp-service: &mcp-service
  restart: unless-stopped
  network_mode: host
  init: true
  stdin_open: true
  tty: true
  logging: *mcp-logging

services:
  mcp-filesystem:
    <<: *mcp-service
    image: mcp/filesystem
    container_name: mcp_filesystem
    volumes:
      - .:/workspace:rw
    working_dir: /workspace
    environment:
      <<: *mcp-env
    healthcheck:
      <<: *mcp-healthcheck
      start_period: 10s

  mcp-postgres:
    <<: *mcp-service
    image: mcp/postgres
    container_name: mcp_postgres
    environment:
      <<: *mcp-env
      DATABASE_URL: "${DATABASE_URL:-postgresql://fanhouse:secret@localhost:5432/fanhouse_test}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *mcp-healthcheck
      start_period: 15s

  mcp-code-analysis:
    <<: *mcp-service
    image: mcp/code-analysis
    container_name: mcp_code_analysis
    volumes:
      - .:/workspace:ro
    working_dir: /workspace
    environment:
      <<: *mcp-env
      MCP_TIMEOUT: "180000"
      MCP_STARTUP_TIMEOUT: "90000"
    healthcheck:
      <<: *mcp-healthcheck
      start_period: 20s

  # Reference to main postgres from docker-compose.yml
  postgres:
    image: postgres:15
    container_name: fanhouse_test_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fanhouse
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: fanhouse_test
    volumes:
      - fanhouse_test_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fanhouse -d fanhouse_test"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  fanhouse_test_pg:
    external: true
