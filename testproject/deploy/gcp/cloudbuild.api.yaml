# Cloud Build config for apps/api
# Builds a container image from apps/api/Dockerfile.
#
# Usage example:
#   gcloud builds submit . --config deploy/gcp/cloudbuild.api.yaml \
#     --substitutions=_IMAGE=gcr.io/PROJECT/fanhouse-api

substitutions:
  _IMAGE: ""

steps:
  - id: "Build API image"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-f"
      - "apps/api/Dockerfile"
      - "-t"
      - "${_IMAGE}"
      - "."

images:
  - "${_IMAGE}"
