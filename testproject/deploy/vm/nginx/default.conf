server {
  listen 80;
  server_name _;

  # Uploads can be images/videos; allow a bit more than default.
  client_max_body_size 20m;

  # API under /api
  location /api/ {
    proxy_pass http://api:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Media streams (kept separate just for clarity)
  location /media/ {
    proxy_pass http://api:4000/media/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Optional: Flutter Web hosted under /flutter
  location /flutter/ {
    alias /usr/share/nginx/html/flutter/;
    try_files $uri $uri/ /flutter/index.html;
  }

  # Next.js app at /
  location / {
    proxy_pass http://web:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
